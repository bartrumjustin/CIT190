<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Form</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            height: 100dvh;
            justify-content: center;
            align-items: center;
        }
        form{
            width: 90%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        label{
            margin: .5em;
        }
        input, button{
            min-width: 50%;
            min-height: 10%;
            margin: 1em;
        }
    </style>
</head>
<body>
    <form>
        <label for="fName">First Name:</label>
        <input type="text" id="fName" name="fName" required autofocus><br>
        <label for="lName">Last Name:</label>
        <input type="text" id="lName" name="lName" required><br>
        <label for="Num1">Enter a 4 digit Number: <br>(1000 - 9999)</label>
        <input type="number" id="Num1" name="Num1" min="1000" max="9999" required><br>
        <label for="Num2">Enter another 4 digit Number: <br>(1000 - 9999)</label>
        <input type="number" id="Num2" name="Num2" min="1000" max="9999" required><br>
        <input type="button" id="subBtn" value="Submit">
        <button type="reset">Reset</button>
    </form>
</body>
<script src="./js/sessionForm.js"></script>
</html>
