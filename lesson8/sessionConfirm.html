<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation!</title>
    <style>
         body{
            display: flex;
            flex-direction: column;
            height: 100dvh;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <h1>Confirmed!</h1>
    <p id="f">First Name:</p>
    <p id="l">Last Name:</p>
    <p id="n1">Number #1</p>
    <p id="n2">Number #2</p>
</body>
<script>
    document.addEventListener('DOMContentLoaded', function(){
        console.log("reading local storage");
        const f = localStorage.getItem('firstName');
        const l = localStorage.getItem('lastName');
        const N1 = localStorage.getItem('Number1');
        const N2 = localStorage.getItem('Number2');
        console.log("read, applying to DOM");
        document.getElementById('f').textContent = f;
        document.getElementById('l').textContent = l;
        document.getElementById('n1').textContent = N1; 
        document.getElementById('n2').textContent = N2;
        localStorage.clear();
    })
</script>
</html>
