<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Photos</title>

    <style>
        body {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        div,
        button {
            margin: 1em;
        }

        button {
            min-height: 5%;
            min-width: 20%;
        }

        img {
            max-width: 80%;
            max-height: 100%;
            
        }

        div {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: aliceblue;
            height: 80%;
            width: 80%;
        }

        button {
            min-width: 70%;
            min-height: 55px;
        }
    </style>
</head>

<body>
    <div id="image">
        
    </div>
    <button id="goFetch">More Doggos please!</button>
</body>
<script>
    async function goFetch() {
        const response = await fetch('https://dog.ceo/api/breeds/image/random');
        dog = await response.json();
        let string = JSON.stringify(dog, null, 0);
        if (!response.ok) {
            console.log("Failed to load, response was not OK");
        }
        else {
            console.log("We have OK response");
            console.log(string + "\n\n" + dog.message);
            document.getElementById('image').innerHTML = `<img src="${dog.message}" alt="dog">`;
        }

    }
    document.getElementById('goFetch').addEventListener('click', function () {
        goFetch();
    })
    window.addEventListener('load', function(){
        goFetch();
    })

</script>

</html>
