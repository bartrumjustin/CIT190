<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/TouchDown.css">
    <title>Touch Down!</title>
</head>
<body>
    <div id="topHud" class="hud">
        <span class="entity">System: <p id="sysState"> - - -</p> </span>
        <span class="entity">Thrust Temp: <p id="TTState"> - - -</p></span>
        <span class="entity">Rate/Descent: <p id="RDState"> - - -</p></span>
        <span class="entity">Elapsed Time: <p id="TimeState">--:--</p></span>
    </div>
    <div id="leftHud" class="hud">
        <p id="NumAlt">***</p>
        
    </div>
    <div id="rightHud" class="hud"></div>
    <div id="viewer">
        <img id="ship" src="./media/LanderShipV2.png" alt="ship">
        <div id="thrustCont">
        <img class="thrust" src="./media/comet.png" alt="thrust">
        <img class="thrust" src="./media/comet.png" alt="thrust">
        </div>
    </div>
    <script src="./js/TouchDown.js"></script>
</body>
</html>
