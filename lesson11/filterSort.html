<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/filterSort.css">
    <title>Filter / Sort</title>
</head>
<body>
    <h1>Image Gallery</h1>
    <div id="search">
        <input type="text" placeholder="Filter images by search" id="searchInput">
    </div>
    <div id="buttons"></div>
    <div id="gallery">
        <img src="./media/cityScapeLofi.jpg" alt="city" data-tags="LoFi,Man-Made" >
        <img src="./media/fieldLofi.jpg" alt="field" data-tags="LoFi,Nature">
        <img src="./media/forrestLofi.jpg" alt="forrest" data-tags="LoFi,Nature">
        <img src="./media/houseLofi.jpg" alt="house" data-tags="LoFi,Man-Made">
        <img src="./media/palmTrees.jpg" alt="palmtrees" data-tags="LoFi,Nature">
        <img src="./media/Sunset.jpg" alt="sunset" data-tags="Nature,LoFi">
        <img src="./media/sunsetSynthwave.jpg" alt="sunset synth" data-tags="Synth,Nature">
        <img src="./media/synthwavePalmTrees.jpg" alt="palmtrees synth" data-tags="Synth,Nature">
    </div>
    
    <script src="./js/jquery.js"></script>
    <script src="./js/filter.js"></script>
    <script src="./js/search.js"></script>
</body>
</html>
