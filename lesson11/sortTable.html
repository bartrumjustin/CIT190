<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/sortTable.css">
    <title>Sort Table</title>
</head>
<body>
    <table class="sortable">
        <thead>
            <tr>
                <th data-sort="number">ID#</th>
                <th data-sort="name">Name</th>
                <th data-sort="double">Balance</th>
            </tr>
        </thead>
        <tbody>
            <tr class="entry">
                <td>1234</td>
                <td>John</td>
                <td>$100</td>
            </tr>
            <tr class="entry">
                <td>1122</td>
                <td>Mary</td>
                <td>$500.50</td>
            </tr>
            <tr class="entry">
                <td>2233</td>
                <td>Zach</td>
                <td>$20.12</td>
            </tr>
        </tbody>
    </table>
    <script src="./js/jquery.js"></script>
    <script src="./js/sortTable.js"></script>
</body>
</html>
