<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/tabs.css">
    <title>Tabs</title>
</head>
<body>
    <Header>
        <h1 id="title">Dash Board</h1>
        <nav id="tab-cont">
            
                <button id="li1" class="tabLink">Systems</button>
                <button id="li2" class="tabLink">Resources</button>
            
        </nav>
    </Header>
    <article>
        <section id="listitem1" class="tabContext">
            <h2>Systems</h2>
            <ul>
                <li>Power/Propulsion: Active</li>
                <li>Defenses: Idle</li>
                <li>Armaments: Stowed and Secured</li>
            </ul>
        </section>
        <section id="listitem2" class="tabContext">
            <h2>Resources</h2>
            <ul>
                <li>Mission Critical Materials: 90%</li>
                <li>Cargo laden: Accounted and Secured</li>
                <li>Emission holdover: 25%</li>
            </ul>
        </section>
        
    </article>
    <script src="./js/tabs.js"></script>
</body>
</html>
