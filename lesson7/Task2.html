<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX-XML</title>
    <style>
        :root {
  --bg-cream: #FFFDD0;
  --text-navy: #0D2B45;
  --accent-sky: #0066CC;   
  --accent-sand: #C29B61;  
  --surface-sand-light: #F4E4BC;
}
        body{
            margin: 0;
            height: 100dvh;
            width: 100dvw;
            background-color: var(--bg-cream);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1{
            padding-top: .25em;
        }
        #load{
            background-color: var(--surface-sand-light);
            color: var(--accent-sky);
            min-width: 100px;
            min-height: 60px;
            padding: .5em;
            font-weight: bold;
        }
        #card{
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;

        }
        #card>div{
            background-color: var(--surface-sand-light);
            color: var(--text-navy);
            margin: .5em;
            padding: .5em;
            border-radius: 10px;
            box-shadow: 2px 3px 4px var(--text-navy);
            max-width: 80%;
            min-width: 30%;
        }
        h2{
            color:var(--text-navy);
        }
        ul{
            padding:0;
            background-color: var(--accent-sand);
            border-radius: 10px;
        }
        li{
            font-weight: bolder;
            list-style: none;
            padding: .75em;
        }
    </style>
</head>
<body>
    <h1 id="cont">Organizational inventory</h1>
    <button id="load">Load current cards</button>
    <div id="card"></div>
    <script>
        const btn = document.getElementById("load");
        let txt = "";
        btn.addEventListener('click', function(){
            let http = new XMLHttpRequest();
            http.onreadystatechange= function(){
                if (http.readyState==4 && http.status==200){
                    xmlDoc = http.responseXML;
                    let a = xmlDoc.getElementsByTagName("name");
                    for(let i = 0; i<a.length; i++){
                        let Name = a[i].textContent;
                        let Id = xmlDoc.getElementsByTagName("id")[i].textContent;
                        let Employees = xmlDoc.getElementsByTagName("empcount")[i].textContent;
                        let Assets = xmlDoc.getElementsByTagName("assets")[i].textContent;
                        txt += `<div id='a${i}'>
                        <h2>${Name}</h2>
                        <ul id='b${i}'>
                            <li class='id'>Department Number: ${Id}</li>
                            <li class='employees'># of Employees: ${Employees}</li>
                            <li class='assets'>Current assets:<br>${Assets}</li>
                            </ul>
                            </div>`;
                            
                    }
                    document.getElementById("card").innerHTML= txt;
                    btn.style.visibility = 'hidden';
                }
            }
            http.open("GET", "Task1.xml", true);
            http.send();
        })
    </script>
</body>
</html>
